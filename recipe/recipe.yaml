context:
  version: "3.2.0"

package:
  name: gp-connect
  version: ${{ version }}

source:
  url: https://github.com/yuezk/GlobalProtect-openconnect/releases/download/v${{ version }}/globalprotect-openconnect-${{ version }}.tar.gz
  sha256: 600687ee59af02a2afef8eece961b71b7a7ba856c66d68e4cec0d323588dc67b

build:
  number: 0
  skip: win
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
      # openconnect resolves iconv to GNU libiconv from $PREFIX, but build.rs only links it on macOS/BSD
      - if: linux
        then: export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS} -C link-arg=-liconv"
      - make build BUILD_GUI_HELPER=0 BUILD_WEBVIEW_AUTH=0
      - make install BUILD_GUI_HELPER=0 BUILD_WEBVIEW_AUTH=0 PREFIX="${PREFIX}"

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - make
    - pkg-config
    - autoconf
    - automake
    - libtool
  host:
    - libxml2-devel
    - zlib
    - openssl
    - gnutls
    - p11-kit
    - nettle
    - gmp
    - if: linux
      then:
        - libiconv
        - lz4-c

tests:
  - script:
      - gpclient --version
      - gpclient --help
      - gpauth --version
      - gpauth --help

about:
  homepage: https://github.com/yuezk/GlobalProtect-openconnect
  summary: "A GlobalProtect VPN client for Linux and macOS, written in Rust, based on OpenConnect and Tauri, supports SSO with MFA, YubiKey, and client certificate authentication, etc."
  description: |
    A GlobalProtect VPN client built on OpenConnect with support for SSO authentication. It provides command-line tools and the GP Connect desktop application for macOS, Linux, FreeBSD, and OpenBSD.
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/yuezk/GlobalProtect-openconnect

extra:
  recipe-maintainers:
    - XhstormR
